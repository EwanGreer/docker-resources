services:
  production:
    container_name: go-production
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_PKG: ${APP_PKG:-./}

  development:
    container_name: go-development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "2345:2345"
    volumes:
      - .:/app
    environment:
      - APP_PKG=${APP_PKG:-./}
